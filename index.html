<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>beNeFit XIV Booklet</title>

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <style>
    :root {
      --native-page-w: 526px;
      --native-page-h: 792px;
      /* Double width for the two-page spread view */
      --native-book-w: calc(var(--native-page-w) * 2);
      --native-book-h: var(--native-page-h);
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden !important;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #flipbook-container {
      position: relative;
      width: var(--native-book-w);
      height: var(--native-book-h);
      max-width: 100vw;
      max-height: 100vh;
    }

    /* Container holding all permanent pages side-by-side */
    #flipbook {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      background: transparent !important;
      overflow: hidden;
    }

    /* Each page is permanently in the DOM, taking up exactly half the spread width */
    .page {
      position: relative;
      width: 50%;
      height: 100%;
      flex-shrink: 0;
      overflow: hidden;
      background: transparent !important;
      transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.6s ease;
    }

    .page img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: fill;
      image-rendering: auto;
      backface-visibility: hidden;
      transform-style: preserve-3d;
      background: transparent;
    }

    .nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 50px; 
      height: 50px;
      background: rgba(0,0,0,0.4);
      border-radius: 50%;
      display: flex; 
      align-items: center; 
      justify-content: center;
      cursor: pointer;
      z-index: 1000;
      transition: background .3s ease, opacity .25s ease;
      user-select: none; 
      -webkit-user-select: none;
      opacity: 1;
    }
    .nav-arrow.is-hidden { opacity: 0; pointer-events: none; }
    .nav-arrow:hover { background: rgba(0,0,0,0.6); }

    .arrow-left { left: -60px; }
    .arrow-right { right: -60px; }

    .nav-arrow svg { width: 24px; height: 24px; fill: #fff; }

    @media (max-width: 900px){
      .arrow-left { left: 10px; }
      .arrow-right { right: 10px; }
    }
  </style>
</head>
<body>

  <div id="flipbook-container" id="book-scaler">
    <div class="nav-arrow arrow-left" id="prevBtn" aria-label="Previous page">
      <svg viewBox="0 0 24 24" role="img" aria-hidden="true">
        <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
      </svg>
    </div>

    <div id="flipbook">
      <div class="page" data-index="0"><img src="pages/page_1.png?v=4" alt="Page 1"></div>
      <div class="page" data-index="1"><img src="pages/page_2.png?v=4" alt="Page 2"></div>
      <div class="page" data-index="2"><img src="pages/page_3.png?v=4" alt="Page 3"></div>
      <div class="page" data-index="3"><img src="pages/page_4.png?v=4" alt="Page 4"></div>
      <div class="page" data-index="4"><img src="pages/page_5.png?v=4" alt="Page 5"></div>
      <div class="page" data-index="5"><img src="pages/page_6.png?v=4" alt="Page 6"></div>
      <div class="page" data-index="6"><img src="pages/page_7.png?v=4" alt="Page 7"></div>
      <div class="page" data-index="7"><img src="pages/page_8.png?v=4" alt="Page 8"></div>
      <div class="page" data-index="8"><img src="pages/page_9.png?v=4" alt="Page 9"></div>
      <div class="page" data-index="9"><img src="pages/page_10.png?v=4" alt="Page 10"></div>
    </div>

    <div class="nav-arrow arrow-right" id="nextBtn" aria-label="Next page">
      <svg viewBox="0 0 24 24" role="img" aria-hidden="true">
        <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6z"/>
      </svg>
    </div>
  </div>

  <script>
    (function(){
      const NATIVE_PAGE_W = 526;
      const NATIVE_PAGE_H = 792;
      const NATIVE_BOOK_W = NATIVE_PAGE_W * 2;
      const NATIVE_BOOK_H = NATIVE_PAGE_H;

      let currentIndex = 0; // 0 represents starting at Page 1 on the right (Spread: [Cover, Page 2])
      const totalPages = 10;

      function updateView() {
        // Ensure index steps by 2 for spread viewing, clamp properly
        if (currentIndex % 2 !== 0) currentIndex -= 1;
        if (currentIndex < 0) currentIndex = 0;
        if (currentIndex >= totalPages) currentIndex = totalPages - 2;

        // Shift the entire permanent layout container via transform translation
        const offsetPercent = -(currentIndex * 50);
        $('#flipbook').css('transform', `translateX(${offsetPercent}%)`);

        // Manage arrow visibility
        $('#prevBtn').toggleClass('is-hidden', currentIndex === 0);
        $('#nextBtn').toggleClass('is-hidden', currentIndex >= totalPages - 2);
      }

      function scaleContainer() {
        const vw = window.innerWidth;
        const vh = window.innerHeight;

        const sideGutter = 160;
        const topBottomGutter = 40;

        const maxW = Math.max(320, vw - sideGutter);
        const maxH = Math.max(240, vh - topBottomGutter);

        const scaleW = maxW / NATIVE_BOOK_W;
        const scaleH = maxH / NATIVE_BOOK_H;
        const scale = Math.min(scaleW, scaleH, 1);

        let calcW = Math.round(NATIVE_BOOK_W * scale);
        let calcH = Math.round(NATIVE_BOOK_H * scale);

        if (calcW % 4 !== 0) calcW += (4 - (calcW % 4));
        if (calcH % 2 !== 0) calcH += (2 - (calcH % 2));

        const $container = $('#flipbook-container');
        $container.css({
          width: calcW + 'px',
          height: calcH + 'px',
          transform: `scale(${scale})`,
          transformOrigin: 'center center'
        });
      }

      function bindEvents() {
        $('#nextBtn').on('click', function(){
          if (currentIndex < totalPages - 2) {
            currentIndex += 2;
            updateView();
          }
        });

        $('#prevBtn').on('click', function(){
          if (currentIndex > 0) {
            currentIndex -= 2;
            updateView();
          }
        });

        document.addEventListener('keydown', (e) => {
          if (e.key === 'ArrowRight' && currentIndex < totalPages - 2) {
            currentIndex += 2;
            updateView();
          }
          if (e.key === 'ArrowLeft' && currentIndex > 0) {
            currentIndex -= 2;
            updateView();
          }
        });
      }

      $(function(){
        scaleContainer();
        updateView();
        bindEvents();
        window.addEventListener('resize', scaleContainer);
      });
    })();
  </script>
</body>
</html>
