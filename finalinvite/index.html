/* ---- Crash fix: prevent pinch-zoom re-rasterization (added manually) ---- */
html, body {
  /* touch-action left at default (auto) so pinch-zoom is allowed for this test */
  overscroll-behavior: none;
  -webkit-text-size-adjust: 100%;

<script>
/* =======================================================================
   MOBILE ZOOM CRASH FIX  (added manually to the Genially HTML export)
   Set BLOCK_ZOOM to false to disable all of this and restore normal zoom.
   ======================================================================= */
(function () {
  var BLOCK_ZOOM = false; // <-- temporarily disabled to test if the preloader fix alone stops the crash
  if (!BLOCK_ZOOM) return;

  var stop = function (e) { e.preventDefault(); };

  // iOS Safari ignores user-scalable=no, so block its gesture events directly.
  document.addEventListener('gesturestart',  stop, { passive: false });
  document.addEventListener('gesturechange', stop, { passive: false });
  document.addEventListener('gestureend',    stop, { passive: false });

  // Fallback for engines without gesture events: kill multi-touch pinch.
  document.addEventListener('touchmove', function (e) {
    if (e.touches.length > 1) e.preventDefault();
  }, { passive: false });

  // Block double-tap-to-zoom without breaking single taps on hotspots.
  var lastTap = 0;
  document.addEventListener('touchend', function (e) {
    var now = Date.now();
    if (now - lastTap <= 300 && e.touches.length === 0) e.preventDefault();
    lastTap = now;
  }, { passive: false });

  // Ctrl+wheel zoom on trackpads (desktop Safari/Chrome).
  document.addEventListener('wheel', function (e) {
    if (e.ctrlKey) e.preventDefault();
  }, { passive: false });
})();

/* =======================================================================
   MEMORY FIX: release the hidden image preloader after load.
   The export puts all 21 images in a hidden div at the bottom of <body>.
   They stay decoded in RAM for the whole session, on every slide, which
   is the main reason zooming runs out of memory. This drops those DOM
   nodes once loading is done; the files stay in the browser HTTP cache,
   so slides still render without re-downloading.
   Set DROP_PRELOADER to false if you see any image pop-in.
   ======================================================================= */
(function () {
  var DROP_PRELOADER = true;
  var DELAY_MS = 5000;
  if (!DROP_PRELOADER) return;

  window.addEventListener('load', function () {
    setTimeout(function () {
      var imgs = document.querySelectorAll('body > div:last-of-type > img[style*="opacity: 0"]');
      if (imgs.length < 5) return;              // safety: not the preloader, leave it alone
      var holder = imgs[0].parentNode;
      if (holder && holder.children.length === imgs.length) holder.remove();
    }, DELAY_MS);
  });
})();
</script>
<script>
/* =======================================================================
   AUDIO KILL SWITCH
   Genially's Audios list in this deck is empty and there's no <audio>/
   <video> tag in this HTML, so whatever is playing comes from inside
   Genially's own JS bundle (static/js/*.js), which isn't visible here.
   This blocks playback at the browser API level instead, so it works
   regardless of what triggers it.
   Set KILL_AUDIO to false to fully restore normal audio behavior.
   ======================================================================= */
(function () {
  var KILL_AUDIO = true;
  if (!KILL_AUDIO) return;

  function silence(el) {
    try {
      el.muted = true;
      el.volume = 0;
      el.autoplay = false;
      el.removeAttribute('autoplay');
      el.pause();
    } catch (e) {}
  }

  // Stop any <audio>/<video> already in the page.
  document.querySelectorAll('audio, video').forEach(silence);

  // Catch elements added later by Genially's JS.
  var observer = new MutationObserver(function (mutations) {
    mutations.forEach(function (m) {
      m.addedNodes && m.addedNodes.forEach(function (node) {
        if (node.nodeType !== 1) return;
        if (node.tagName === 'AUDIO' || node.tagName === 'VIDEO') silence(node);
        if (node.querySelectorAll) node.querySelectorAll('audio, video').forEach(silence);
      });
    });
  });
  observer.observe(document.documentElement, { childList: true, subtree: true });

  // Neutralize play() itself so nothing can start, even programmatically.
  if (window.HTMLMediaElement) {
    var origPlay = HTMLMediaElement.prototype.play;
    HTMLMediaElement.prototype.play = function () {
      silence(this);
      return Promise.resolve();
    };
  }
})();
</script>
