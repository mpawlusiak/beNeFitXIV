<!--
  Genially mobile rendering-load mitigation wrapper
  ---------------------------------------------------
  On mobile, this renders the Genially iframe at a REDUCED internal
  resolution, then visually scales it back up with a CSS transform.
  Genially's own player gets fewer pixels/less layout to manage for
  the exact same content — a lighter memory footprint without
  removing or changing anything inside the Genially project itself.

  This does NOT touch pinch-zoom. Native zoom still works on this
  region exactly as before — this only changes the resolution
  Genially renders at internally, not how zoom is handled.

  HOW TO TUNE:
  Set DOWNSCALE below. 1 = off (no change). Lower values (0.85, 0.7,
  0.6...) give Genially's engine less to render, which should raise
  the memory threshold before a crash — but text/images will look
  slightly softer since they're stretched back up via CSS.

  Start at 0.85 (barely noticeable softness) and test on the actual
  device that crashes. If it still crashes, step down (0.75, 0.65...)
  until it stops, then back off slightly for a safety margin. The
  value where crashes stop is also useful data to hand to Genially —
  it shows the crash is resolution/memory-bound, not a fixed bug.
-->
<div id="genially-embed-wrapper" style="
  position: relative;
  width: 100%;
  max-width: 1200px;
  aspect-ratio: 16 / 9;
  margin: 0 auto;
  overflow: hidden;
">
  <!-- overflow is "hidden" on purpose, not "scroll"/"auto" — that
       combination (scaled child + scroll/auto overflow) is one of
       the known trigger conditions for the iOS zoom-crash bug. -->
  <iframe
    id="genially-embed-iframe"
    src="https://view.genially.com/6a9b023e89aca745b7674cb1"
    title="beNeFit XIV Invitation"
    allowfullscreen
    scrolling="no"
    style="
      position: absolute;
      top: 0;
      left: 0;
      border: 0;
      transform-origin: top left;
    "
  ></iframe>
</div>

<script>
(function () {
  var DOWNSCALE = 0.5; // 1 = off. Lower = more headroom, softer visuals.

  var wrapper = document.getElementById('genially-embed-wrapper');
  var iframe = document.getElementById('genially-embed-iframe');

  function isMobile() {
    // Match whatever breakpoint your existing desktop/mobile
    // Genially toggle already uses, so this stays consistent.
    return window.matchMedia('(max-width: 768px)').matches;
  }

  function applySizing() {
    var rect = wrapper.getBoundingClientRect();
    var fullW = rect.width;
    var fullH = rect.height;

    if (isMobile() && DOWNSCALE < 1) {
      var renderW = fullW * DOWNSCALE;
      var renderH = fullH * DOWNSCALE;
      var scale = 1 / DOWNSCALE;

      iframe.style.width = renderW + 'px';
      iframe.style.height = renderH + 'px';
      iframe.style.transform = 'scale(' + scale + ')';
    } else {
      iframe.style.width = fullW + 'px';
      iframe.style.height = fullH + 'px';
      iframe.style.transform = 'none';
    }
  }

  applySizing();
  window.addEventListener('resize', applySizing);
  window.addEventListener('orientationchange', applySizing);
})();
</script>
