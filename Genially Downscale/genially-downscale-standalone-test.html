<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- This was missing from the fragment version — without it, mobile
     browsers render against a fake ~980px virtual viewport, so
     isMobile() below returns false even on a real phone. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Genially Downscale Test</title>
<style>
  body { margin: 0; font-family: -apple-system, sans-serif; }
  #debug-readout {
    background: #111;
    color: #0f0;
    font-family: monospace;
    font-size: 14px;
    padding: 10px;
    text-align: center;
  }
</style>
</head>
<body>

<div id="debug-readout">loading…</div>

<div id="genially-embed-wrapper" style="
  position: relative;
  width: 100%;
  max-width: 1200px;
  aspect-ratio: 16 / 9;
  margin: 0 auto;
  overflow: hidden;
">
  <iframe
    id="genially-embed-iframe"
    src="https://view.genially.com/6a9b023e89aca745b7674cb1"
    title="beNeFit XIV Invitation"
    allowfullscreen
    scrolling="no"
    style="
      position: absolute;
      top: 0;
      left: 0;
      border: 0;
      transform-origin: top left;
    "
  ></iframe>
</div>

<script>
(function () {
  var DOWNSCALE = 0.2; // matches what you were testing

  var wrapper = document.getElementById('genially-embed-wrapper');
  var iframe = document.getElementById('genially-embed-iframe');
  var readout = document.getElementById('debug-readout');

  function isMobile() {
    return window.matchMedia('(max-width: 768px)').matches;
  }

  function applySizing() {
    var rect = wrapper.getBoundingClientRect();
    var fullW = rect.width;
    var fullH = rect.height;
    var mobile = isMobile();

    if (mobile && DOWNSCALE < 1) {
      var renderW = fullW * DOWNSCALE;
      var renderH = fullH * DOWNSCALE;
      var scale = 1 / DOWNSCALE;

      iframe.style.width = renderW + 'px';
      iframe.style.height = renderH + 'px';
      iframe.style.transform = 'scale(' + scale + ')';
    } else {
      iframe.style.width = fullW + 'px';
      iframe.style.height = fullH + 'px';
      iframe.style.transform = 'none';
    }

    readout.textContent =
      'viewport width: ' + window.innerWidth + 'px | ' +
      'mobile detected: ' + mobile + ' | ' +
      'downscale active: ' + (mobile && DOWNSCALE < 1 ? DOWNSCALE : 'off (1.0)');
  }

  applySizing();
  window.addEventListener('resize', applySizing);
  window.addEventListener('orientationchange', applySizing);
})();
</script>

</body>
</html>
